name: AlwaysData Keepalive

on:
  schedule:
    # 每天 UTC 00:00 运行
    - cron: '5 0 * * 2'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright browsers
      run: |
        playwright install chromium --with-deps

    - name: Run Keepalive Script
      env:
        AD_USERNAME: ${{ secrets.AD_USERNAME }}
        AD_PASSWORD: ${{ secrets.AD_PASSWORD }}
        ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python -u main.py

    - name: 🧹 清理旧的工作流运行记录
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
